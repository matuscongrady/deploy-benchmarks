service: bmk-serverless-lambda-5
frameworkVersion: '4.44.0'
provider:
  name: aws
  runtime: nodejs22.x
  region: eu-west-1
  memorySize: 512
  timeout: 30
build:
  esbuild:
    external:
      - pdfkit
functions:
  report:
    handler: handlers/report.handler
  product-lookup:
    handler: handlers/product-lookup.handler
  cart-pricing:
    handler: handlers/cart-pricing.handler
  create-order:
    handler: handlers/create-order.handler
  notification:
    handler: handlers/notification.handler
