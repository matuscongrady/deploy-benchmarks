{
  "projectName": "bmk-stacktape-container-node",
  "resources": {
    "api": {
      "type": "web-service",
      "properties": {
        "packaging": {
          "type": "js-bundle",
          "properties": {
            "entryfilePath": "server.mjs"
          }
        },
        "resources": {
          "cpu": 0.25,
          "memory": 512
        }
      }
    }
  },
  "stackConfig": {
    "outputs": [
      {
        "name": "apiUrl",
        "value": "$ResourceParam('api', 'url')"
      }
    ]
  }
}